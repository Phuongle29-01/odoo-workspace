name: odoo-smart-workspace
services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: workspace
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:?Set LOCAL_POSTGRES_PASSWORD}
      POSTGRES_DB: workspace
    ports: ['127.0.0.1:5433:5432']
    volumes: ['workspace-db:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U workspace -d workspace']
      interval: 3s
      timeout: 3s
      retries: 30
  app:
    profiles: ['app']
    image: smart-workspace:local
    build: .
    env_file: .env.local
    environment:
      DATABASE_URL: postgresql://workspace:${LOCAL_POSTGRES_PASSWORD}@db:5432/workspace
      ODOO_URL: ${DOCKER_ODOO_URL:-${ODOO_URL:?Set ODOO_URL}}
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped
  odoo:
    profiles: ['local']
    image: odoo:17.0
    environment:
      HOST: db
      USER: workspace
      PASSWORD: ${LOCAL_POSTGRES_PASSWORD}
      LOCAL_ODOO_ADMIN_PASSWORD: ${LOCAL_ODOO_ADMIN_PASSWORD}
      LOCAL_TEST_PASSWORD_A: ${LOCAL_TEST_PASSWORD_A}
      LOCAL_TEST_PASSWORD_B: ${LOCAL_TEST_PASSWORD_B}
    command:
      [
        'odoo',
        '-d',
        'workspace_test',
        '-i',
        'project,smart_workspace_bridge',
        '--addons-path=/mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons',
        '--without-demo=all',
        '--db-filter=^workspace_test$$',
        '--http-interface=0.0.0.0',
        '--no-database-list',
      ]
    ports: ['127.0.0.1:8069:8069']
    volumes:
      - odoo-data:/var/lib/odoo
      - ./scripts/seed-odoo.py:/seed/seed-odoo.py:ro
      - ./addons:/mnt/extra-addons:ro
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'python3',
          '-c',
          "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8069/web/login?db=workspace_test',timeout=5).status == 200",
        ]
      interval: 5s
      timeout: 6s
      start_period: 60s
      retries: 30
volumes:
  workspace-db:
  odoo-data:
